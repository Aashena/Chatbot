name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  REGION: us-central1
  REPO_NAME: chatbotrepo        # Change to your Artifact Registry repo name
  IMAGE_NAME: chatbot_api      # Change to your desired image name
  SERVICE_NAME: chatbotapi  # Change to your Cloud Run service name
  PYTHONPATH: src

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-jammy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # --- STEP 1: RUN TEST CASES ---
    # - name: Set up Python # We don't need to install python if we are using "mcr.microsoft.com/playwright/python:v1.57.0-jammy"
    #   uses: actions/setup-python@v5
    #   with:
    #     python-version: '3.10'  # Change to your Python version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Install your project dependencies
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # playwright install #We don't need this as long as we have the right container image above: mcr.microsoft.com/playwright/python:v1.57.0-jammy
    
    - name: Run Tests
      env:
        PYTHONPATH: ${{ env.PYTHONPATH }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
        UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        echo "Running test cases..."
        pytest tests/
    
  deploy:
    runs-on: ubuntu-latest
    needs: test   # only runs if tests pass

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    # --- STEP 1: AUTHENTICATE TO GCP ---
    - name: Google Auth
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # --- STEP 2: CONFIGURE DOCKER ---
    - name: Authorize Docker
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev

    # --- STEP 3: BUILD AND PUSH ---
    # Using GitHub's free ubuntu-latest runner (amd64)
    - name: Build and Push Container
      run: |
        docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:${{ github.sha }} .
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:${{ github.sha }}

    # --- STEP 4: DEPLOY TO CLOUD RUN ---
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:${{ github.sha }} \
          --region $REGION \
          --platform managed \
          --timeout 600 \
          --allow-unauthenticated \
          --set-env-vars "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},UPSTASH_VECTOR_REST_URL=${{ secrets.UPSTASH_VECTOR_REST_URL }},UPSTASH_VECTOR_REST_TOKEN=${{ secrets.UPSTASH_VECTOR_REST_TOKEN }},TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"