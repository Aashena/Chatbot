name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  REGION: us-central1
  REPO_NAME: chatbotrepo        # Change to your Artifact Registry repo name
  IMAGE_NAME: chatbot_api      # Change to your desired image name
  SERVICE_NAME: chatbotapi  # Change to your Cloud Run service name
  PYTHONPATH: src

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # --- STEP 1: PLACEHOLDER FOR TEST CASES ---
    - name: Run Tests
      run: |
        echo "Running test cases..."
        # Example: pytest
        # pip install pytest && pytest
    
    # --- STEP 2: AUTHENTICATE TO GCP ---
    - name: Google Auth
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # --- STEP 3: CONFIGURE DOCKER ---
    - name: Authorize Docker
      run: |
        gcloud auth configure-docker us-central1-docker.pkg.dev

    # --- STEP 4: BUILD AND PUSH ---
    # Using GitHub's free ubuntu-latest runner (amd64)
    - name: Build and Push Container
      run: |
        docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:${{ github.sha }} .
        docker push us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:${{ github.sha }}

    # --- STEP 5: DEPLOY TO CLOUD RUN ---
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:${{ github.sha }} \
          --region $REGION \
          --platform managed \
          --timeout 600 \
          --allow-unauthenticated \
          --set-env-vars "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }},UPSTASH_VECTOR_REST_URL=${{ secrets.UPSTASH_VECTOR_REST_URL }},UPSTASH_VECTOR_REST_TOKEN=${{ secrets.UPSTASH_VECTOR_REST_TOKEN }},TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"